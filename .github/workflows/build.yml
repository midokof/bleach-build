name: Build Bleach.dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib
        run: |
          set -e
          xcode-select -p
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -shared \
            -arch arm64 \
            -target arm64-apple-ios14.0 \
            -isysroot "$SDK" \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -o Bleach.dylib \
            Bleach.m
          file Bleach.dylib
          ls -la Bleach.dylib
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bleach.dylib
          path: Bleach.dylib