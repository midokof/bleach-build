name: Build Bleach.dylib

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          COMMON="-target arm64-apple-ios14.0 -isysroot $SDK -fobjc-arc -framework Foundation -framework UIKit -framework QuartzCore -framework CoreGraphics"
          clang -shared -arch arm64 $COMMON -o Bleach_arm64.dylib Bleach.m
          clang -shared -arch arm64e $COMMON -target arm64e-apple-ios14.0 -o Bleach_arm64e.dylib Bleach.m
          lipo -create Bleach_arm64.dylib Bleach_arm64e.dylib -output Bleach.dylib
          file Bleach.dylib
          ls -la Bleach.dylib
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bleach.dylib
          path: Bleach.dylib